# Builds the Hugo site and publishes it to GitHub Pages on every push to main.
# Hugo version is pinned to the range supported by the Blowfish theme (0.164–0.167).
# To upgrade: check themes/blowfish/config.toml ([module.hugoVersion] min/max) first.

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      HUGO_ENVIRONMENT: production
      TZ: America/Edmonton
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version

      - name: Checkout (with Blowfish submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history, so lastmod dates from git work

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Processed images (resized gallery photos) are reused between runs to keep builds fast.
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ github.run_id }}
          restore-keys: hugo-resources-

      - name: Build
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
